# Real-Time Network Threat Detection - Docker setup
#
#   Whole project (Kafka + pipeline + dashboard), on any machine with Docker:
#       docker compose up --build        -> open http://localhost:8501
#       docker compose down              -> stop everything
#
#   Kafka only (used by run.bat / run.py when the pipeline runs on Windows directly):
#       docker compose up -d kafka
#
services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: soc-kafka
    ports:
      - "9092:9092"                       # for programs on the host (run.bat / run.py)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller        # KRaft mode, no ZooKeeper
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  app:
    build: .
    container_name: soc-pipeline
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092           # Kafka's address inside the Docker network
    ports:
      - "8501:8501"                                 # dashboard -> http://localhost:8501
